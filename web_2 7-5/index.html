

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>関数の利用</title>
</head>
<body>

<h2>関数の実行結果</h2>

<pre id="result"></pre>

<script>
// sum関数
function sum(a, b) {
    return a + b;
}
const sum2 = (a, b) => a + b;

// fibo関数
function fibo(n) {
    if (n < 2) {
        return n;
    }
    return fibo(n - 1) + fibo(n - 2);
}
const fibo2 = (n) => n < 2 ? n : fibo2(n - 1) + fibo2(n - 2);

// betweenOrBound関数
function betweenOrBound(low, high, n) {
    return n < low ? low : (n > high ? high : n);
}
const betweenOrBound2 = (low, high, n) => {
    if (n >= low && n <= high)
        return n;
    else if (n < low)
        return low;
    else
        return high;
};

// 実行結果を表示
document.getElementById("result").textContent =
    "sum: " + sum2(3, 5) + "\n" +
    "fibo: " + fibo2(6) + "\n" +
    "betweenOrBound: " + betweenOrBound2(1, 10, 15);

</script>

</body>
</html>
