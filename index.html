<!DOCTYPE html>
<html lang="ja">
    <head>

    <meta charset="UTF-8">
    <title>変数の演算子</title>

    </head>

    <body>
    <h1>変数の演算子</h1>
    <p>a=10、b=4の場合</p>
    <button onclick="answer_add();">足し算</button>
    <button onclick="answer_subtract();">引き算</button>
    <button onclick="answer_ultiply();">掛け算</button>
    <button onclick="answer_divide();">割り算</button>

    <script>
    let price = [a=10,b=4]
    function answer_add() {
        alert('答えは' + [ a + b] + 'です')
    }
    function answer_subtract() {
        alert('答えは' + [ a - b] + 'です')
    }
    function answer_ultiply() {
        alert('答えは' + [ a * b] + 'です')
    }
    function answer_divide() {
        alert('答えは' + [ a / b] + 'です')
    }
    
    
    </script>

    </body>
    

</html>
