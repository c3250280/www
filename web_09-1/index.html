<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>Click Counter for構文</title>
    </head>
    <style>

    body{
        font-family: sans-serif;
        text-align: center;
        background: #eef2ff;
        padding: 30px;
}

.box {
    background: white;
    width: 80%;
    max-width: 700px;
    margin: auto;
    padding: 30px;
    border-radius: 25px;
}

button {
    width: 90%;
    padding: 20px;
    background: linear-gradient(90deg, #2864ed, #5145e8);
    color: white;
    font-size: 25px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
}

#count {
    color: #2864ed;
    font-size: 40px;
    font-weight: bold;
}

#result {
    background: #f5f6fa;
    padding: 30px;
    margin-top: 20px;
    border-radius: 20px;
    min-height: 80px;
    font-size: 24px;
}
</style>

<body>

<h1>Click Counter ★ for構文</h1>
<p>ボタンをクリックすると、クリック回数に応じて結果が変わります。</p>

<div class="box">

<p>クリック回数 <span id="count">0</span> 回</p>

<button onclick="clickCount()">クリック</button>

<h3>結果</h3>
<div id="result">ここに結果が表示されます</div>

</div>

<script>
let count = 0;

function clickCount() {

    count++;

    document.getElementById("count").textContent = count;

    let result = "";

    if (count == 1) {

        for (let i = 0; i < 1; i++) {
            result += "★";
        }

    } else if (count == 2) {

        for (let i = 0; i < 5; i++) {
            result += "★";
        }

    } else if (count == 3) {

        for (let i = 1; i <= 5; i++) {
            result += i + " ";
        }

    } else if (count == 4) {

        for (let i = 2; i <= 10; i += 2) {
            result += i + " ";
        }

    } else if (count == 5) {

        let sum = 0;

        for (let i = 1; i <= count; i++) {
            sum += i;
        }

        result = "合計値：" + sum;

    } else if (count >= 6) {

        result = "クリアしました。カウントを0に戻します。";
        count = 0;

    }

    document.getElementById("result").textContent = result;
    document.getElementById("count").textContent = count;
}
</script>

</body>
</html>
