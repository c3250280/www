<!DOCTYPE html>
<html lang="ja">
    <head>

    <meta charset="UTF-8">
    <title>電卓</title>

    </head>
<body>
    <h1>計算</h1>
    <input id = "op1" type="number">
    <select id="op">
        <option value="+">+</option>
         <option value="-">-</option>
          <option value="*">*</option>
           <option value="/">/</option>
    </select>
<input id = "op2" type="number">

<button onclick = "calc()">計算</button>

<p id="result"></p>

<script>
    function calc(){
        let a = Number(document.getElementById("op1").value);
        let b = Number(document.getElementById("op2").value);
    let op = document.getElementById("op").value;
    let result;

    switch(op) {
        case "+": result = a + b; break;
        case "-": result = a - b; break;
        case "*": result = a * b; break;
        case "/": result = a / b; break;
    }

    document.getElementById("result").textContent = result;
}
    
</script>
</body>
</html>
