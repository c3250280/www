<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">

        <title>要素の取得と内容の変更</title>
        <style>
body {
    margin: 20px;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
}

h1 {
    font-size: 50px;
}

p {
    font-size: 30px;
    margin-top: 70px;
}

#status {
    color: red;
    font-weight: bold;
}

button {
    font-size: 25px;
    padding: 10px 20px;
    margin-top: 20px;
}

h2 {
    font-size: 35px;
    margin-top: 30px;
}

        </style>

    </head>
    <body>
        <h1>座席の予約</h1>
        <p>東京会場<span id="status">(予約受付中)</span></p>

        <button id="reserve" onclick="reservation()">予約する</button>
        <script>
            function reservation(){
                document.getElementById("status").textContent = "(予約済み)";

                document.getElementById("reserve").remove();

                let message = document.createElement("h2");
                message.textContent = "ありがとうございました。";
                document.body.appendChild(message);
            }
        </script>
    </body>
</html>
