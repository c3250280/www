<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">

        <title>要素の取得と内容の変更</title>

    </head>
    <body>
        <h1>座席の予約</h1>
        <p>東京会場<span id="status">(予約受付中)</span></p>

        <button id="reserve" onclick="reservation()">予約する</button>
        <script>
            function reservation(){
                document.getElementById("status").textContent = "(予約済み)";

                document.getElementById("reserve").remove();

                let message = document.createElement("h2");
                message.textContent = "ありがとうございました。";
                document.body.appendChild(message);
            }
        </script>
    </body>
</html>
